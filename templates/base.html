<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Saldo privado{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="profile-{{ profile.slug }}">
    <header class="site-header">
      <a class="brand" href="{{ url_for('dashboard', profile_slug='warein') }}">Saldo privado</a>
      <nav class="profile-links" aria-label="Seleccionar perfil">
        <a class="{% if profile.slug == 'warein' %}active{% endif %}" href="{{ url_for('dashboard', profile_slug='warein') }}">Warein</a>
        <a class="{% if profile.slug == 'isa' %}active{% endif %}" href="{{ url_for('dashboard', profile_slug='isa') }}">Isa</a>
        <a class="{% if profile.slug == 'hipoteca' %}active{% endif %}" href="{{ url_for('dashboard', profile_slug='hipoteca') }}">Hipoteca</a>
        <a class="{% if profile.slug == 'total' %}active{% endif %}" href="{{ url_for('dashboard', profile_slug='total') }}">Total</a>
      </nav>
    </header>
    <main>
      <nav class="section-nav" aria-label="Secciones de {{ profile.label }}">
        <a href="{{ url_for('dashboard', profile_slug=profile.slug) }}">Resumen</a>
        <a href="{{ url_for('balances_page', profile_slug=profile.slug) }}">Saldos</a>
        {% if profile.slug != 'total' %}<a href="{{ url_for('total_page', profile_slug=profile.slug) }}">Movimientos</a>{% endif %}
        <a href="{{ url_for('monthly_page', profile_slug=profile.slug) }}">Mensual</a>
      </nav>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="notice {{ category }}" role="status">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
